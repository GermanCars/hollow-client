name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened, description: And what you expected instead. }
    validations: { required: true }
  - type: textarea
    attributes: { label: How to make it happen, placeholder: "1. Switch on ...\n2. ..." }
  - type: input
    attributes: { label: Hollow Client version, placeholder: 0.1.0 }
    validations: { required: true }
  - type: textarea
    attributes: { label: Other mods and log, description: Paste the log or crash report. Remove anything private first. }
